[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "location-lab"
version = "0.1.0"
description = "Offline-first iPhone location simulation research workspace"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
location-lab = "location_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
